server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths (/accounts, /faq…) get index.html, and React Router
    # takes over. Without this, reloading any page except / gives 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's built files have content hashes in their names, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}