services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama 
    expose:
      - "11434"
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPUS:-2}"
          memory: 6g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${ASSISTANT_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  assistant:
    build: ../backend/NordiskaPortal.Assistant
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY}
      Assistant__BaseUrl: http://ollama:11434
      Assistant__Model: ${ASSISTANT_MODEL:-qwen2.5:3b}
      Assistant__Threads: ${OLLAMA_CPUS:-2}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN}
    ports:
      - "5080:8080"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-data:
    name: ollama-data