services:
  app:
    platform: linux/amd64
    volumes:
      - ./pdf-output:/app/output
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:8081

  db:
    ports:
      - "5433:5432"