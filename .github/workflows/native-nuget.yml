name: Native NuGet

on:
  push:
    branches: [main, dev]
    paths:
      - 'native/**'
      - '.github/workflows/native-nuget.yml'
  pull_request:
    # Only main: this is scoped to the cheap version-bump guard below, not
    # the full build/pack/publish pipeline. A PR into dev proves nothing
    # that a real push to dev won't prove a few minutes later anyway, and
    # doubling every build for that is wasted CI minutes on a shared org
    # quota. Use workflow_dispatch on the rare occasion a branch's actual
    # package needs testing before merge.
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-nuget.yml'
  workflow_dispatch: {}

concurrency:
  group: native-nuget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  VCPKG_COMMIT: '301856f5f2824f788a3ffa6332293861cccd23b4'

jobs:
  # Fails the PR if native/** changed but native/VERSION wasn't bumped to go
  # with it. Without this, forgetting the bump means the push to main still
  # "succeeds" but --skip-duplicate silently no-ops the actual publish —
  # nobody gets the fix, and nothing tells you that happened.
  #
  # This only fails the check; it doesn't block the merge by itself. Add it
  # as a required status check under Settings -> Branches -> main to make it
  # a real gate.
  guard-version-bump:
    name: Require a VERSION bump for main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check native/VERSION was bumped
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CODE_CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- native/ | grep -v '^native/VERSION$' || true)
          VERSION_CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- native/VERSION || true)

          if [ -n "$CODE_CHANGED" ] && [ -z "$VERSION_CHANGED" ]; then
            echo "::error::native/** changed but native/VERSION was not bumped. Merging this as-is will silently skip publishing to main's feed (--skip-duplicate) since the version already exists — bump native/VERSION before merging."
            exit 1
          fi
          echo "OK: native/VERSION was bumped, or native/** has no changes."

  version:
    # Skip on pull_request entirely: the guard above is the only check a PR
    # needs. The full build/pack/publish pipeline only runs for a real push
    # (merge to dev/main) or an explicit manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: calc
        shell: bash
        run: |
          BASE=$(tr -d '[:space:]' < native/VERSION)
          # github.ref_name is "123/merge" on a pull_request event, not the
          # branch name — head_ref is the real source-branch name and is
          # only set for pull_request events, so this covers both triggers.
          BRANCH="${{ github.head_ref || github.ref_name }}"

          if [ "$BRANCH" = "main" ]; then
            VERSION="$BASE"
          elif [ "$BRANCH" = "dev" ]; then
            # run_number is monotonic across the whole workflow, so
            # 0.1.0-dev.41 < 0.1.0-dev.42 < 0.1.0 under SemVer 2 ordering.
            VERSION="$BASE-dev.${{ github.run_number }}"
          else
            # Everything else: a manual dispatch on a feature branch, or now
            # (via the pull_request trigger above) an automatic build for a
            # PR opened against dev/main. Either way it's a one-off test
            # build, tagged with the branch so it can't be mistaken for a
            # real dev build even though run_number is shared across all
            # triggers of this workflow. SemVer prerelease identifiers only
            # allow [0-9A-Za-z-], so sanitize e.g. "feat/pdf_signer" ->
            # "feat-pdf-signer".
            SAFE_BRANCH=$(echo "$BRANCH" | tr -c '0-9A-Za-z' '-' | sed -E 's/-+/-/g; s/^-|-$//g')
            VERSION="$BASE-$SAFE_BRANCH.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

  # ---------------------------------------------------------------------------
  build-windows:
    name: pdf_engine.dll (x64)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Setup vcpkg
        id: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgJsonGlob: 'native/vcpkg.json'
          # Dependencies are installed by CMake in manifest mode at configure
          # time, so don't install them twice.
          runVcpkgInstall: false

      # lukka/run-vcpkg@v11 defaults to vcpkg's "x-gha" binary cache
      # provider, which vcpkg itself removed in April 2025 — so without
      # this, every run silently rebuilds every dependency from source.
      # This swaps it for a plain filesystem cache directory that
      # actions/cache persists between runs instead.
      - name: Point vcpkg at a filesystem binary cache
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          # vcpkg's cache is content-addressed per port (keyed by each
          # port's own ABI hash), so restoring a slightly-stale cache is
          # still safe — vcpkg just rebuilds whatever doesn't match. The
          # vcpkg.json hash + pinned commit here just give a genuine
          # dependency bump a clean new cache lineage instead of an
          # ever-growing one.
          key: vcpkg-windows-x64-static-md-${{ hashFiles('native/vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-windows-x64-static-md-${{ hashFiles('native/vcpkg.json') }}-
            vcpkg-windows-x64-static-md-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        env:
          VCPKG_ROOT_RESOLVED: ${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}
        run: >
          cmake -S . -B build/release
          -G Ninja
          --no-warn-unused-cli
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT_RESOLVED/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DBUILD_TESTING=OFF
          -DPDF_ENGINE_RESTRICT_SYMBOLS=ON

      - name: Build
        run: cmake --build build/release --target pdf_engine

      - name: Stage
        run: cmake --install build/release --prefix stage --component Unspecified

      # Fails loudly now rather than at P/Invoke time in production.
      - name: Verify exports
        run: |
          $dll = "stage/pdf_engine.dll"
          if (-not (Test-Path $dll)) { throw "pdf_engine.dll was not produced" }
          # dumpbin's output comes back as an array of lines; -notmatch against
          # an array filters to non-matching *elements* rather than testing
          # the whole thing, so it's almost always "truthy" regardless of
          # whether the symbol is present. Join to one string first so the
          # match is a real yes/no.
          $exportText = (& dumpbin /exports $dll) -join "`n"
          if ($exportText -notmatch 'pdf_engine_generate_and_sign') {
            Write-Host $exportText
            throw "pdf_engine_generate_and_sign is not exported"
          }
          Write-Host "OK: $((Get-Item $dll).Length) bytes"

      - uses: actions/upload-artifact@v6
        with:
          name: native-win-x64
          path: native/stage/pdf_engine.dll
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  build-linux:
    name: libpdf_engine.so (x64)
    if: github.event_name != 'pull_request'
    # Pinned to 22.04 on purpose: it sets the glibc floor (2.35) for the
    # shipped .so. Building on a newer image would make the library refuse to
    # load on older distros. If this runner label is ever retired, switch to
    # `runs-on: ubuntu-latest` + `container: ubuntu:22.04` and apt-get the
    # toolchain in a first step.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Build prerequisites for the vcpkg ports (openssl, podofo and its
      # freetype/fontconfig/libxml2 tree all use autotools somewhere).
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            autoconf automake autoconf-archive libtool gperf bison flex nasm \
            python3 python3-jinja2 python3-setuptools \
            zip unzip curl git patchelf

      - name: Setup vcpkg
        id: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgJsonGlob: 'native/vcpkg.json'
          runVcpkgInstall: false

      # See the matching step in build-windows: run-vcpkg's default cache
      # provider (x-gha) was removed from vcpkg upstream in April 2025, so
      # this filesystem cache + actions/cache is what actually persists
      # built dependencies between runs.
      - name: Point vcpkg at a filesystem binary cache
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-x64-pic-${{ hashFiles('native/vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-linux-x64-pic-${{ hashFiles('native/vcpkg.json') }}-
            vcpkg-linux-x64-pic-

      - name: Configure
        env:
          VCPKG_ROOT_RESOLVED: ${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}
        run: >
          cmake -S . -B build/release
          -G Ninja
          --no-warn-unused-cli
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_RESOLVED/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_OVERLAY_TRIPLETS=cmake/triplets
          -DVCPKG_TARGET_TRIPLET=x64-linux-pic
          -DBUILD_TESTING=OFF
          -DPDF_ENGINE_RESTRICT_SYMBOLS=ON

      - name: Build
        run: cmake --build build/release --target pdf_engine

      - name: Stage
        run: cmake --install build/release --prefix stage --component Unspecified

      # The three things that actually break in production, checked here:
      # leftover shared deps, a too-new glibc, and leaked OpenSSL symbols.
      - name: Verify self-containment
        run: |
          SO=stage/libpdf_engine.so
          test -f "$SO" || { echo "libpdf_engine.so was not produced"; exit 1; }

          echo "--- DT_NEEDED ---"
          readelf -d "$SO" | grep NEEDED || true

          ALLOWED='libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|ld-linux'
          UNEXPECTED=$(readelf -d "$SO" | grep NEEDED \
            | sed -E 's/.*\[(.*)\]/\1/' | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "ERROR: not self-contained, still needs:"; echo "$UNEXPECTED"
            exit 1
          fi

          echo "--- Max glibc version required ---"
          MAXGLIBC=$(objdump -T "$SO" | grep -o 'GLIBC_[0-9.]*' \
            | sort -V -u | tail -1)
          echo "$MAXGLIBC"

          echo "--- Exported symbols ---"
          nm -D --defined-only "$SO" | awk '{print $3}' | grep -v '^_' || true
          if nm -D --defined-only "$SO" | grep -q ' SSL_\| EVP_CIPHER_CTX_new'; then
            echo "ERROR: OpenSSL symbols leaked into the dynamic symbol table"
            exit 1
          fi
          nm -D --defined-only "$SO" | grep -q pdf_engine_generate_and_sign \
            || { echo "ERROR: public API not exported"; exit 1; }

          echo "OK: $(stat -c%s "$SO") bytes"

      - uses: actions/upload-artifact@v6
        with:
          name: native-linux-x64
          path: native/stage/libpdf_engine.so
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  pack-and-push:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: native-win-x64
          path: native/packaging/staging/win-x64

      - uses: actions/download-artifact@v7
        with:
          name: native-linux-x64
          path: native/packaging/staging/linux-x64

      - name: Pack
        run: >
          dotnet pack packaging/PdfEngine.Native.csproj
          -c Release
          -p:Version=${{ needs.version.outputs.version }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -p:RepositoryCommit=${{ github.sha }}
          -o artifacts

      - name: Show package contents
        run: unzip -l artifacts/*.nupkg

      - uses: actions/upload-artifact@v6
        with:
          name: nupkg-${{ needs.version.outputs.version }}
          path: native/artifacts/*.nupkg
          if-no-files-found: error

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
